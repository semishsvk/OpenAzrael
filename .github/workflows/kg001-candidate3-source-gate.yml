name: KG-001 Candidate 3 source gate

on:
  push:
    branches:
      - main
      - test/kg001-physical-traversal
      - build/kg001-candidate3-windows
  pull_request:

permissions:
  contents: read

jobs:
  source-contract:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install source-validator dependencies
        run: python -m pip install --upgrade pip numpy pillow trimesh

      - name: Run source-only KG-001 gate
        run: python tools/run_kg001_candidate_v112.py --source-only

      - name: Verify tracked checkout stayed clean
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
