name: KG-001 Candidate 4 source gate

on:
  push:
    branches:
      - integration/kg001-candidate3-pppv-v2
  pull_request:

permissions:
  contents: read

jobs:
  source-contract:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validator dependencies
        run: python -m pip install --upgrade pip numpy pillow trimesh
      - name: Run inherited source-only KG-001 gate
        run: python tools/run_kg001_candidate_v112.py --source-only
      - name: Validate Candidate 4 hard release contract
        run: python tools/validate_candidate4_release_contract_v132.py
      - name: Validate Candidate 4 MUSIC.DAT route contract
        run: python tools/validate_candidate4_music_route_v133.py
      - name: Validate XMIDI converter and music renderer contracts
        run: |
          python tools/validate_xmi_to_midi_v134.py
          python tools/validate_candidate4_music_renderer_v135.py
          python -m py_compile \
            tools/analyze_candidate4_music_route_v133.py \
            tools/xmi_to_midi_v134.py \
            tools/render_candidate4_music_v135.py \
            tools/validate_candidate4_audio_corpus_v132.py \
            tools/run_candidate4_preflight.py \
            tools/export_candidate4.py
      - name: Validate Candidate 4 proof capture contract
        run: |
          python tools/validate_kg001_proof_capture_v151.py
          python tools/validate_kg001_proof_capture_v152.py
          python -m unittest tools.remaster_framework.tests.test_capture_safety
          python tools/capture_candidate4_proof_video.py --help >/dev/null
          python -m py_compile \
            tools/capture_candidate4_proof_video.py \
            tools/remaster_framework/capture_safety.py \
            tools/validate_kg001_proof_capture_v152.py
      - name: Verify tracked checkout stayed clean
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=normal)"

  video-capture-toolchain:
    name: Video capture Godot 4.7.2
    if: github.event_name == 'pull_request' && github.head_ref == 'video/balanced-smooth-audio-v156'
    runs-on: ubuntu-24.04
    steps:
      - name: Download pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            -o Godot_v4.7.2-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          printf '%s  %s\n' \
            'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4' \
            'Godot_v4.7.2-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip -d godot-4.7.2
          chmod +x godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64

      - name: Verify toolchain
        shell: bash
        run: godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Upload pinned Godot
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-linux-x86_64-video-capture
          path: godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64
          if-no-files-found: error
          retention-days: 1
