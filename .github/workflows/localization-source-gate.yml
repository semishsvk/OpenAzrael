name: Localization source gate

on:
  push:
    branches:
      - integration/kg001-candidate3-pppv-v2
  pull_request:

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate localization contracts and packs
        run: python tools/validate_localization_v139.py
      - name: Compile localization tools
        run: python -m py_compile tools/localization_tool_v139.py tools/validate_localization_v139.py
      - name: Verify tracked checkout stayed clean
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=normal)"
