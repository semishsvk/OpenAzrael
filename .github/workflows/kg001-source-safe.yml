name: KG-001 source-safe Candidate 2

on:
  push:
    branches:
      - main
      - integration/kg001-independent-audit
  pull_request:
    paths:
      - ".github/workflows/kg001-source-safe.yml"
      - "project.godot"
      - "main.tscn"
      - "export_presets.cfg"
      - "scripts/**"
      - "tools/**"
      - "data/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  source-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"
          cache: "pip"
          cache-dependency-path: tools/requirements-kg001-source-safe.txt

      - name: Install pinned Python toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements-kg001-source-safe.txt

      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip             https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          test "$("$GODOT_BIN" --version)" = "4.7.2.stable.official.ed1daf0bf"

      - name: Validate pinned toolchain
        run: |
          python tools/validate_kg001_toolchain_v117.py             --godot "$GODOT_BIN" --require-godot

      - name: Generate source-safe build manifest
        run: |
          python tools/write_kg001_build_manifest.py --godot "$GODOT_BIN"

      - name: Validate export preset
        run: python tools/validate_kg001_export_preset_v117.py

      - name: Compile Python tools
        run: python -m compileall -q tools

      - name: Godot project parse/import smoke
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --quit 2>&1 | tee /tmp/openazrael-godot-parse.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Failed to create an autoload' /tmp/openazrael-godot-parse.log; then
            echo "Godot source parse/import reported a script/autoload failure." >&2
            exit 1
          fi

      - name: Canonical KG-001 source-safe suite
        env:
          GODOT_BIN: ${{ env.GODOT_BIN }}
        run: |
          python tools/run_kg001_candidate_v112.py --godot "$GODOT_BIN"

      - name: Repository remains clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
