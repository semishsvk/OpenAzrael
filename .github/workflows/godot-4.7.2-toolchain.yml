name: Godot 4.7.2 toolchain artifact

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/godot-4.7.2-toolchain.yml"

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --output godot.zip "$url"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum --check -
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v4.7.2-stable_linux.x86_64
          ./godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Upload verified Godot binary
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-linux-x86_64
          path: godot/Godot_v4.7.2-stable_linux.x86_64
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
