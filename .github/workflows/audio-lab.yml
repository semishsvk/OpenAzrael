name: Audio Lab source-safe tests

on:
  push:
    branches:
      - audio-lab-al-poc-01
      - audio-lab-al-poc-02
    paths:
      - "tools/audio_lab/**"
      - "tests/test_audio_lab_*.py"
      - "data/audio_lab/**"
      - "data/audio/legacy_world_ir.json"
      - "data/backup/source_fingerprints.json"
      - ".github/workflows/audio-lab.yml"
  pull_request:
    paths:
      - "tools/audio_lab/**"
      - "tests/test_audio_lab_*.py"
      - "data/audio_lab/**"
      - "data/audio/legacy_world_ir.json"
      - "data/backup/source_fingerprints.json"
      - ".github/workflows/audio-lab.yml"
  workflow_dispatch:

jobs:
  source-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Audio Lab spectral dependencies
        run: python -m pip install -r tools/audio_lab/requirements-spectral.txt
      - name: Compile Audio Lab
        run: python -m compileall -q tools/audio_lab
      - name: Smoke Audio Lab CLIs
        run: |
          python tools/audio_lab/oa_audio_scan.py --help >/dev/null
          python tools/audio_lab/oa_audio_canonical_verify.py --help >/dev/null
          python tools/audio_lab/oa_audio_spectral.py --help >/dev/null
          python tools/audio_lab/oa_audio_spectral_baseline.py --help >/dev/null
          python tools/audio_lab/oa_audio_run_poc02.py --help >/dev/null
          python tools/audio_lab/oa_audio_validate.py --help >/dev/null
          python tools/audio_lab/oa_audio_reference_audit.py --help >/dev/null
          python tools/audio_lab/oa_audio_repo_evidence.py --help >/dev/null
          python tools/audio_lab/oa_audio_repo_drift.py --help >/dev/null
          python tools/audio_lab/oa_audio_review_pack.py --help >/dev/null
          python tools/audio_lab/oa_audio_run_poc.py --help >/dev/null
      - name: Audit repository audio evidence
        run: python tools/audio_lab/oa_audio_repo_evidence.py --output .tmp/audio_lab/repo_evidence.json
      - name: Check repository mapping drift
        run: python tools/audio_lab/oa_audio_repo_drift.py --output .tmp/audio_lab/repo_mapping_drift.json
      - name: Run Audio Lab tests
        run: python -m unittest discover -s tests -p "test_audio_lab_*.py" -v
