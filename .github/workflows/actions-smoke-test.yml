name: Actions smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/actions-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Prove GitHub-hosted runner works
        run: |
          echo "OPENAZRAEL_ACTIONS_SMOKE_PASS"
          echo "event=$GITHUB_EVENT_NAME"
          echo "sha=$GITHUB_SHA"
